<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Biblioteca de Prompts · UI & UX</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta name="theme-color" content="#253529" />
<!-- aplica tema e estado do menu antes da pintura, evitando flash -->
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(localStorage.getItem("nav")==="collapsed")document.documentElement.classList.add("nav-collapsed");}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* ============ Tema claro (padrão) — contraste WCAG AA ============ */
  :root{
    /* Neutros (cinza levemente esverdeado) para a base */
    --bg:#F1F2EF; --panel:#FFFFFF; --panel-2:#ECEDEA; --border:#D9DBD4;
    --text:#161A16;          /* 15.7:1 sobre --bg  */
    --muted:#59605A;         /* 6.5:1  sobre --panel */
    /* Verdes da paleta reservados para acentos */
    --accent:#3A5A44;        /* 6.9:1  sobre --bg (link)  */
    --accent-hover:#26402E;
    --accent-soft:#E5EBE0;
    --nav-active:#24402D;    /* 9.4:1  sobre --accent-soft  */
    --code-bg:#1F251F; --code-text:#E9EAE6; --focus:#3A5A44;
    --header-bg:#253529; --header-fg:#E9EAE6;
    --header-h:56px; --sidebar-w:288px; --measure:768px;
    --shadow:0 1px 2px rgba(20,25,20,.06),0 8px 24px rgba(20,25,20,.07);
    color-scheme:light;
  }
  /* ============ Tema escuro — contraste WCAG AA ============ */
  :root[data-theme="dark"]{
    --bg:#181A18; --panel:#212420; --panel-2:#2A2D29; --border:#3B3F3A;
    --text:#E9EAE6;          /* 14.5:1 sobre --bg   */
    --muted:#A6ADA5;         /* 6.8:1  sobre --panel */
    --accent:#BFD0B2;        /* 10.7:1 sobre --bg (link) */
    --accent-hover:#D6E0CC;
    --accent-soft:#262B22;
    --nav-active:#BFD0B2;    /* 8.9:1  sobre --accent-soft */
    --code-bg:#0F110E; --code-text:#E9EAE6; --focus:#8AA88A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#181A18; --panel:#212420; --panel-2:#2A2D29; --border:#3B3F3A;
      --text:#E9EAE6; --muted:#A6ADA5; --accent:#BFD0B2; --accent-hover:#D6E0CC;
      --accent-soft:#262B22; --nav-active:#BFD0B2; --code-bg:#0F110E; --code-text:#E9EAE6;
      --focus:#8AA88A; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:40; height:var(--header-h);
    display:flex; align-items:center; gap:12px; padding:0 20px;
    background:var(--header-bg); color:var(--header-fg); box-shadow:0 1px 0 rgba(0,0,0,.10);
  }
  header .brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; min-width:0}
  header .brand .logo{display:flex; align-items:center; flex-shrink:0}
  header .brand .logo img{height:30px; width:auto; display:block}
  header .brand .divider{width:1px; height:20px; flex-shrink:0; background:rgba(255,255,255,.28)}
  header .brand .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header .brand .sep{opacity:.6; font-weight:400}
  header .spacer{flex:1}
  header .icon-btn{
    display:grid; place-items:center; width:36px; height:36px; flex-shrink:0;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.24);
    color:var(--header-fg); border-radius:8px; cursor:pointer; font-size:15px; line-height:1;
  }
  header .icon-btn:hover{background:rgba(255,255,255,.22)}
  header .icon-btn:focus-visible{outline-color:var(--header-fg)}
  header .ext{
    color:var(--header-fg); text-decoration:none; font-size:13px; font-weight:500;
    border:1px solid rgba(255,255,255,.35); padding:6px 13px; border-radius:20px; white-space:nowrap;
  }
  header .ext:hover{background:rgba(255,255,255,.14)}
  header .ext:focus-visible{outline-color:var(--header-fg)}

  /* Botão de menu visível em todas as larguras (recolhe a barra no desktop) */
  .menu-btn{display:grid}
  @media (min-width:861px){
    html.nav-collapsed aside{display:none}
  }

  /* ---------- Shell ---------- */
  .shell{display:flex; align-items:flex-start}
  aside{
    width:var(--sidebar-w); flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--border);
    position:sticky; top:var(--header-h); height:calc(100vh - var(--header-h));
    overflow-y:auto; padding:0 14px 40px;
  }
  /* Barra de busca */
  .search-wrap{position:sticky; top:0; z-index:2; background:var(--panel); padding:14px 0 12px; margin-bottom:8px; border-bottom:1px solid var(--border)}
  .search-ico{position:absolute; left:11px; top:calc(14px + 19px); transform:translateY(-50%); font-size:13px; opacity:.7; pointer-events:none}
  #search{
    width:100%; padding:9px 12px 9px 32px; border:1px solid var(--border); border-radius:8px;
    background:var(--panel-2); color:var(--text); font:inherit; font-size:14px;
  }
  #search::placeholder{color:var(--muted)}
  #search:focus{outline:2px solid var(--focus); outline-offset:1px; border-color:transparent}
  /* Item + pino */
  .nav-row{position:relative}
  .nav-row a{padding-left:34px}
  .pin{
    position:absolute; left:7px; top:50%; transform:translateY(-50%); width:24px; height:24px; padding:0; z-index:2;
    display:grid; place-items:center; background:transparent; border:none; cursor:pointer;
    color:var(--muted); font-size:15px; line-height:1; border-radius:6px;
    opacity:0; transition:opacity .12s,color .12s,background .12s;
  }
  .nav-row:hover .pin, .pin.on, .pin:focus-visible{opacity:1}
  .pin.on{color:var(--accent)}
  .pin:hover{color:var(--accent); background:var(--panel-2)}
  .nav-empty{color:var(--muted); font-size:13px; padding:10px 12px; font-style:italic}
  .nav-group{margin-bottom:20px}
  .nav-group > .label{
    display:flex; align-items:center; gap:8px; width:100%;
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; text-align:left;
    color:var(--muted); font-weight:600; margin:0 0 6px; padding:6px 10px;
    background:transparent; border:none; cursor:pointer; font-family:inherit; border-radius:6px;
    transition:background .12s,color .12s;
  }
  .nav-group > .label:hover{background:var(--panel-2); color:var(--text)}
  .nav-group > .label .g-ico{display:flex; flex-shrink:0}
  .nav-group > .label .g-ico svg{width:14px; height:14px; display:block}
  .nav-group > .label .g-label{flex:1; min-width:0}
  .nav-group > .label .chev{display:flex; flex-shrink:0; margin-left:auto}
  .nav-group > .label .chev svg{width:12px; height:12px; display:block; transition:transform .18s}
  .nav-group.collapsed > .label{margin-bottom:0}
  .nav-group.collapsed > .label .chev svg{transform:rotate(-90deg)}
  .nav-group.collapsed .nav-items{display:none}
  aside a{
    display:block; text-decoration:none; color:var(--text); font-size:14px;
    padding:9px 12px; border-radius:8px; margin-bottom:2px; line-height:1.3;
    border-left:2px solid transparent; transition:background .12s,border-color .12s;
  }
  aside a .t{font-weight:500}
  aside a small{display:block; color:var(--muted); font-size:11px; margin-top:3px; line-height:1.35}
  aside a:hover{background:var(--panel-2)}
  aside a.active{background:var(--accent-soft); border-left-color:var(--accent)}
  aside a.active .t{color:var(--nav-active); font-weight:600}
  aside a.active small{color:var(--nav-active)}

  /* ---------- Conteúdo ---------- */
  main{flex:1; min-width:0; display:flex; justify-content:center; padding:44px 40px 96px}
  article{width:100%; max-width:var(--measure); line-height:1.7; font-size:16px; overflow-wrap:break-word; word-break:break-word}
  article h1{font-size:clamp(26px,4vw,34px); font-weight:600; margin:.1em 0 .5em; line-height:1.2; letter-spacing:-.01em}
  article h2{font-size:22px; font-weight:600; margin:1.7em 0 .7em; padding-bottom:.35em; border-bottom:1px solid var(--border)}
  article h3{font-size:17px; font-weight:600; margin:1.5em 0 .5em}
  article p,article li{color:var(--text)}
  article strong{font-weight:600}
  article a{color:var(--accent); text-decoration:none; border-bottom:1px solid transparent}
  article a:hover{border-bottom-color:var(--accent)}
  article blockquote{
    margin:1.2em 0; padding:14px 18px; border:1px solid var(--border); border-left:3px solid var(--accent);
    background:var(--panel); border-radius:0 10px 10px 0; color:var(--muted); box-shadow:var(--shadow);
  }
  article blockquote p{margin:.3em 0}
  .table-wrap{overflow-x:auto; margin:1.3em 0; border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); background:var(--panel)}
  article table{border-collapse:collapse; width:100%; font-size:14px; min-width:min(560px,100%)}
  article th,article td{padding:11px 14px; text-align:left; vertical-align:top; border-bottom:1px solid var(--border)}
  article thead th{background:var(--panel-2); font-weight:600; white-space:nowrap; border-bottom:2px solid var(--border)}
  article tbody tr:last-child td{border-bottom:none}
  article tbody tr:hover td{background:var(--panel-2)}
  article code{
    background:var(--panel-2); padding:.15em .42em; border-radius:5px;
    font-family:"IBM Plex Mono",Consolas,monospace; font-size:.86em; border:1px solid var(--border);
  }
  .code-wrap{position:relative; margin:1.3em 0}
  article pre{
    background:var(--code-bg); color:var(--code-text); border-radius:12px;
    padding:18px 20px; overflow-x:auto; margin:0; box-shadow:var(--shadow);
  }
  article pre code{background:none; border:none; padding:0; color:inherit; font-size:13.5px; line-height:1.6; font-family:"IBM Plex Mono",Consolas,monospace}
  .copy-btn{
    position:absolute; top:10px; right:10px; font-size:11px; cursor:pointer; z-index:2;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); color:#f4f4f4;
    border-radius:6px; padding:5px 10px; opacity:0; transition:opacity .12s,background .12s;
    font-family:"Space Grotesk",sans-serif;
  }
  .code-wrap:hover .copy-btn,.copy-btn:focus-visible{opacity:1}
  .copy-btn:hover{background:rgba(255,255,255,.24)}
  article hr{border:none; border-top:1px solid var(--border); margin:2.2em 0}
  article img{max-width:100%; height:auto}
  .badges{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px}
  .badge{font-size:12px; font-weight:500; padding:4px 11px; border-radius:20px; border:1px solid var(--border); line-height:1.5; white-space:nowrap}
  .badge-task{background:var(--accent-soft); color:var(--nav-active); border-color:transparent; font-weight:600}
  .badge-fw,.badge-tec{background:var(--panel-2); color:var(--text)}
  .badge-nivel{background:transparent; color:var(--muted)}
  .badge svg{width:11px; height:11px; margin-right:4px; vertical-align:-1px}
  /* Ícones SVG */
  .icon-btn svg{width:18px; height:18px}
  .ext svg{width:12px; height:12px; margin-left:5px; vertical-align:-1px}
  .search-ico svg{width:14px; height:14px; display:block}
  .pin svg{width:14px; height:14px; display:block}
  #loading{color:var(--muted); font-style:italic}

  /* ---------- Responsivo ---------- */
  @media (max-width:860px){
    :root{--sidebar-w:270px}
    header .ext{display:none}
    aside{
      position:fixed; top:var(--header-h); left:0; z-index:35;
      transform:translateX(-100%); transition:transform .22s ease;
      box-shadow:8px 0 30px rgba(0,0,0,.28); width:min(84vw,var(--sidebar-w));
    }
    aside.open{transform:translateX(0)}
    .backdrop{display:none; position:fixed; inset:var(--header-h) 0 0 0; z-index:34; background:rgba(0,0,0,.45)}
    .backdrop.show{display:block}
    main{padding:28px 20px 80px}
    article{font-size:15.5px}
  }
  @media (max-width:480px){
    header{padding:0 12px; gap:8px}
    main{padding:22px 16px 72px}
    article pre{padding:14px 15px}
  }
</style>
</head>
<body>
  <header>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menu">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
    </button>
    <div class="brand">
      <span class="logo">
        <img src="assets/logo-tema-escuro.png" alt="gabriel.des.br" />
      </span>
      <span class="divider" aria-hidden="true"></span>
      <span class="txt">Biblioteca de Prompts <span class="sep">·</span> UI &amp; UX</span>
    </div>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema claro/escuro" title="Alternar tema"></button>
    <a class="ext" href="https://github.com/gabrielgt5/Biblioteca-de-Prompt-para-UI-e-UX" target="_blank" rel="noopener">GitHub<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.2v3.3A1.5 1.5 0 0 1 9.5 14h-6A1.5 1.5 0 0 1 2 12.5v-6A1.5 1.5 0 0 1 3.5 5H7"/></svg></a>
  </header>

  <div class="shell">
    <div class="backdrop" id="backdrop"></div>
    <aside id="sidebar">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.3"/><path d="m10.2 10.2 3.3 3.3"/></svg></span>
        <input id="search" type="search" placeholder="Buscar…" aria-label="Buscar na biblioteca" autocomplete="off" />
      </div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <article id="content"><p id="loading">Carregando…</p></article>
    </main>
  </div>

<script>
  const NAV = [
    { label: "Início", icon: "home", items: [
      { file: "README.md", title: "Visão geral", info: "Índice geral e guia de escolha rápida da biblioteca." },
    ]},
    { label: "Frameworks UX", icon: "layers", items: [
      { file: "frameworks/01-ux-ui/CARE.md",     title: "CARE",      info: "Planeje pesquisa e usabilidade. (Context · Ask · Rules · Examples)" },
      { file: "frameworks/01-ux-ui/RTCF.md",     title: "RTCF",      info: "Especifique telas e componentes de alta fidelidade. (Role · Task · Context · Format)" },
      { file: "frameworks/01-ux-ui/C-C-E-R-A.md",title: "C-C-E-R-A", info: "Gere UI de alta fidelidade com acessibilidade e autocrítica." },
      { file: "frameworks/01-ux-ui/ICE.md",      title: "ICE",       info: "Monte instruções rápidas do dia a dia. (Instruction · Context · Expectation)" },

    { label: "Frameworks gerais", icon: "grid", items: [
      { file: "frameworks/02-gerais/COSTAR.md", title: "COSTAR", info: "Conecte objetivos de negócio ao design. (Context · Objective · Style · Tone · Audience · Response)" },
      { file: "frameworks/02-gerais/CRISPE.md", title: "CRISPE", info: "Compare soluções e alternativas técnicas. (Capacity · Insight · Statement · Personality · Experiment)" },
      { file: "frameworks/02-gerais/RACE.md",   title: "RACE",   info: "Padronize entregas rápidas e repetitivas. (Role · Action · Context · Expectation)" },
      { file: "frameworks/02-gerais/BAB.md",    title: "BAB",    info: "Escreva microcopy persuasivo. (Before · After · Bridge)" },
    ]},
    { label: "Técnicas", icon: "gear", items: [
      { file: "tecnicas/chain-of-thought.md",       title: "Chain-of-Thought",     info: "Faz o modelo raciocinar passo a passo antes de responder." },
      { file: "tecnicas/decomposicao-step-zero.md", title: "Decomposição / Step Zero", info: "Resolve a jornada completa antes de detalhar as telas." },
      { file: "tecnicas/few-shot.md",               title: "Few-Shot",             info: "Guia o modelo com exemplos de entrada e saída." },
      { file: "tecnicas/zero-shot.md",              title: "Zero-Shot",            info: "Instrução direta, sem exemplos — para tarefas simples." },
      { file: "tecnicas/prompting-iterativo.md",    title: "Prompting Iterativo",  info: "Refina a saída em camadas: v1 → v2 → v3." },
      { file: "tecnicas/autocritica.md",            title: "Autocrítica",          info: "O modelo revisa a própria saída antes de entregar." },
    ]},
    { label: "Receitas", icon: "beaker", items: [
      { file: "receitas/onboarding/arquitetura-fluxo-onboarding.md", title: "Fluxo de Onboarding",       info: "Estruture um fluxo de onboarding completo. (CARE × Chain-of-Thought)" },
      { file: "receitas/design-system/documentacao-componente-ui.md", title: "Documentação de Componente", info: "Documente um componente do Design System. (RTCF × Few-Shot)" },
      { file: "receitas/ux-writing/microcopy-erro-critico.md",       title: "Microcopy de Erro",         info: "Refine mensagens de erro em 3 turnos. (C-C-E-R-A × Iterativo)" },
      { file: "receitas/ux-writing/mensagens-erro-humanas.md",       title: "Mensagens de Erro Humanas", info: "Escreva mensagens de erro humanas e acessíveis. (RTCF × Few-Shot)" },
      { file: "receitas/ux-writing/reescrita-direta-microcopy.md",   title: "Reescrita Direta (Plug-and-Play)", info: "Otimize a copy de uma tela pronta, sem mexer no layout. (RTCF × Zero-Shot)" },
    ]},
    { label: "Imagens", icon: "image", items: [
      { file: "imagens-e-fotos/sobre.md", title: "Visão geral", info: "Introdução à categoria: prompts para gerar e editar imagens e fotos (Midjourney, DALL·E, Stable Diffusion, Gemini, Firefly)." },
      { file: "imagens-e-fotos/anatomia-do-prompt.md", title: "Anatomia do prompt", info: "A fórmula: Sujeito + Composição + Iluminação + Textura + Equipamento ótico, com exemplo montado." },
      { file: "imagens-e-fotos/dicionario-iluminacao.md", title: "Dicionário: Iluminação", info: "Fragmentos de luz: chiaroscuro, Rembrandt, high-key." },
      { file: "imagens-e-fotos/dicionario-composicao.md", title: "Dicionário: Composição", info: "Rule of thirds, knolling, dutch angle, isometric 3D." },
      { file: "imagens-e-fotos/dicionario-texturas.md", title: "Dicionário: Texturas", info: "Impasto, 35mm film grain, matte ceramic, brushed metal." },
      { file: "imagens-e-fotos/dicionario-estilos.md", title: "Dicionário: Estilos", info: "Flat design, claymorphism, glassmorphism, editorial noir." },
      { file: "imagens-e-fotos/catalogo-por-objetivo.md", title: "Catálogo por objetivo", info: "Escolha o estilo visual pelo objetivo de negócio (matriz 2×2)." },
    ]},
    { label: "Personas", icon: "users", items: [
      { file: "personas/sobre.md", title: "Visão geral", info: "Coleção de prompts para gerar e validar personas de UX com dados concretos (cargo, ferramentas, contexto)." },
      { file: "personas/geracao-de-persona.md", title: "Geração de persona", info: "Prompt principal: dados concretos + anti-alucinação + Flow Mode, saída em JSON de restrições de layout." },
      { file: "personas/auditoria-de-persona.md", title: "Auditoria de persona", info: "Bandeiras vermelhas e teste de estresse para validar personas geradas por IA." },
      { file: "personas/jornada-do-usuario.md", title: "Mapa de Jornada", info: "Gere um mapa de jornada do usuário detalhado (tabela), com regras de controle anti-clichê. Opção SaaS ou era da IA." },
    ]},
  ];

  const ICON = {
    moon: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 9.4A5.5 5.5 0 1 1 6.6 2.6a4.5 4.5 0 0 0 6.8 6.8Z"/></svg>',
    sun:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"/></svg>',
    layers: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 2 5l6 3 6-3-6-3Z"/><path d="M2.2 8 8 11l5.8-3M2.2 11 8 14l5.8-3"/></svg>',
    gear: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.1"/><path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/></svg>',
    pinOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>',
    pinOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>',
    chevron: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>',
    home: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7 8 2.5 13.5 7"/><path d="M4 6.4V13h8V6.4"/></svg>',
    grid: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="4.6" height="4.6" rx="1"/><rect x="8.9" y="2.5" width="4.6" height="4.6" rx="1"/><rect x="2.5" y="8.9" width="4.6" height="4.6" rx="1"/><rect x="8.9" y="8.9" width="4.6" height="4.6" rx="1"/></svg>',
    beaker: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.2h4M6.6 2.2v4L3.6 11.9a1 1 0 0 0 .9 1.5h7a1 1 0 0 0 .9-1.5L9.4 6.2v-4"/><path d="M5 9.6h6"/></svg>',
    image: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="3" width="11.6" height="10" rx="1.6"/><circle cx="5.7" cy="6.3" r="1.1"/><path d="m2.8 11.2 3.1-2.6 2.4 2 2.1-1.7 3.4 2.8"/></svg>',
    users: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.2" r="2.4"/><path d="M3.6 13c0-2.3 2-3.7 4.4-3.7s4.4 1.4 4.4 3.7"/></svg>',
  };

  const nav = document.getElementById("nav");
  const content = document.getElementById("content");
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("backdrop");
  const searchEl = document.getElementById("search");

  const ALL = NAV.flatMap(g => g.items);
  let currentFile = "";

  // Pinos persistidos
  let pins = new Set();
  try{ const s = JSON.parse(localStorage.getItem("pins") || "[]"); if(Array.isArray(s)) pins = new Set(s); }catch(e){}
  function savePins(){ try{ localStorage.setItem("pins", JSON.stringify([...pins])); }catch(e){} }
  function togglePin(file){ pins.has(file) ? pins.delete(file) : pins.add(file); savePins(); renderNav(); }

  function itemRow(it){
    const row = document.createElement("div"); row.className = "nav-row";
    const a = document.createElement("a");
    a.href = "#" + it.file; a.dataset.file = it.file;
    a.innerHTML = `<span class="t">${it.title}</span>`;
    if(it.file === currentFile) a.classList.add("active");
    const on = pins.has(it.file);
    const pin = document.createElement("button");
    pin.type = "button"; pin.className = "pin" + (on ? " on" : "");
    pin.innerHTML = on ? ICON.pinOn : ICON.pinOff;
    pin.title = on ? "Desafixar" : "Fixar"; pin.setAttribute("aria-label", pin.title);
    pin.onclick = (e) => { e.preventDefault(); e.stopPropagation(); togglePin(it.file); };
    row.appendChild(pin); row.appendChild(a);
    return row;
  }
  // Grupos recolhíveis (persistidos). Padrão: todos fechados na 1ª visita.
  let collapsedGroups;
  try{
    const raw = localStorage.getItem("collapsedGroups");
    collapsedGroups = raw ? new Set(JSON.parse(raw)) : new Set(NAV.map(g => g.label));
  }catch(e){ collapsedGroups = new Set(NAV.map(g => g.label)); }
  const searching = () => (searchEl.value || "").trim().length > 0;
  function toggleGroup(label, g, btn){
    const nowCollapsed = g.classList.toggle("collapsed");
    btn.setAttribute("aria-expanded", nowCollapsed ? "false" : "true");
    nowCollapsed ? collapsedGroups.add(label) : collapsedGroups.delete(label);
    try{ localStorage.setItem("collapsedGroups", JSON.stringify([...collapsedGroups])); }catch(e){}
  }
  function groupEl(label, items, iconKey){
    const g = document.createElement("div"); g.className = "nav-group";
    const hasActive = items.some(it => it.file === currentFile);
    const collapsed = collapsedGroups.has(label) && !searching() && !hasActive;
    if(collapsed) g.classList.add("collapsed");
    const gico = (iconKey && ICON[iconKey]) ? ICON[iconKey] : "";
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "label";
    btn.innerHTML = `<span class="g-ico">${gico}</span><span class="g-label">${label}</span><span class="chev">${ICON.chevron}</span>`;
    btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
    btn.onclick = () => toggleGroup(label, g, btn);
    g.appendChild(btn);
    const box = document.createElement("div"); box.className = "nav-items";
    items.forEach(it => box.appendChild(itemRow(it)));
    g.appendChild(box);
    return g;
  }
  function renderNav(){
    const q = (searchEl.value || "").trim().toLowerCase();
    const match = it => !q || (it.title + " " + (it.info || "")).toLowerCase().includes(q);
    nav.innerHTML = "";
    const pinned = ALL.filter(it => pins.has(it.file) && match(it));
    if(pinned.length) nav.appendChild(groupEl("Fixados", pinned, "pinOn"));
    NAV.forEach(gr => {
      const items = gr.items.filter(it => !pins.has(it.file) && match(it));
      if(items.length) nav.appendChild(groupEl(gr.label, items, gr.icon));
    });
    if(!nav.children.length){
      const e = document.createElement("p"); e.className = "nav-empty";
      e.textContent = "Nada encontrado."; nav.appendChild(e);
    }
  }
  searchEl.addEventListener("input", renderNav);
  renderNav();

  /* ----- Tema claro/escuro ----- */
  const themeBtn = document.getElementById("themeBtn");
  function systemDark(){ return matchMedia("(prefers-color-scheme:dark)").matches; }
  function activeTheme(){ return document.documentElement.getAttribute("data-theme") || (systemDark() ? "dark" : "light"); }
  function paintThemeIcon(){ themeBtn.innerHTML = activeTheme() === "dark" ? ICON.sun : ICON.moon; }
  function setTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    try{ localStorage.setItem("theme", t); }catch(e){}
    paintThemeIcon();
  }
  themeBtn.onclick = () => setTheme(activeTheme() === "dark" ? "light" : "dark");
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change", paintThemeIcon);
  paintThemeIcon();

  /* ----- Menu: off-canvas no mobile / recolhe no desktop ----- */
  const menuBtn = document.getElementById("menuBtn");
  const isMobile = () => matchMedia("(max-width:860px)").matches;
  function closeMenu(){ sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
  menuBtn.onclick = () => {
    if(isMobile()){
      sidebar.classList.toggle("open"); backdrop.classList.toggle("show");
    }else{
      const collapsed = document.documentElement.classList.toggle("nav-collapsed");
      try{ localStorage.setItem("nav", collapsed ? "collapsed" : "open"); }catch(e){}
    }
  };
  backdrop.onclick = closeMenu;

  /* ----- Frontmatter -> badges ----- */
  function splitFrontmatter(text){
    const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    if(!m) return { meta:null, body:text };
    const meta = {};
    m[1].split("\n").forEach(line => {
      const i = line.indexOf(":"); if(i < 0) return;
      const key = line.slice(0,i).trim();
      let val = line.slice(i+1).trim();
      if(val.startsWith("[") && val.endsWith("]"))
        val = val.slice(1,-1).split(",").map(s => s.trim()).filter(Boolean);
      meta[key] = val;
    });
    return { meta, body:text.slice(m[0].length) };
  }
  function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function arr(v){ return Array.isArray(v) ? v : (v ? [v] : []); }
  function renderBadges(meta){
    if(!meta) return "";
    const chips = [];
    if(meta.tarefa) chips.push(`<span class="badge badge-task">${esc(meta.tarefa)}</span>`);
    arr(meta.frameworks).forEach(f => chips.push(`<span class="badge badge-fw">${ICON.layers}${esc(f)}</span>`));
    arr(meta.tecnicas).forEach(t => chips.push(`<span class="badge badge-tec">${ICON.gear}${esc(t)}</span>`));
    if(meta.nivel) chips.push(`<span class="badge badge-nivel">${esc(meta.nivel)}</span>`);
    return chips.length ? `<div class="badges">${chips.join("")}</div>` : "";
  }

  /* ----- Roteamento / render ----- */
  function resolvePath(base, rel){
    if(/^https?:\/\//.test(rel)) return rel;
    const stack = base.split("/"); stack.pop();
    rel.split("/").forEach(p => {
      if(p === "..") stack.pop();
      else if(p !== "." && p !== "") stack.push(p);
    });
    return stack.join("/");
  }

  async function load(file){
    file = file.replace(/^\.?\//, "");
    content.innerHTML = '<p id="loading">Carregando…</p>';
    try{
      const res = await fetch(file, {cache:"no-cache"});
      if(!res.ok) throw new Error(res.status);
      const parsed = splitFrontmatter(await res.text());
      content.innerHTML = renderBadges(parsed.meta) + marked.parse(parsed.body);
      postProcess(file);
    }catch(e){
      content.innerHTML = `<h1>Ops…</h1><p>Não consegui carregar <code>${file}</code>.</p>
        <p style="color:var(--muted)">Ao abrir direto do disco (<code>file://</code>) o navegador bloqueia a leitura dos arquivos.
        Publique no GitHub Pages ou rode um servidor local:</p>
        <div class="code-wrap"><pre><code>py -m http.server</code></pre></div>`;
    }
    currentFile = file;
    renderNav();
    window.scrollTo(0,0);
  }

  function postProcess(currentFile){
    content.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if(href.startsWith("#") || /^https?:\/\//.test(href) || href.startsWith("mailto:")) return;
      if(href.endsWith(".md")) a.setAttribute("href", "#" + resolvePath(currentFile, href));
    });
    content.querySelectorAll("table").forEach(t => {
      const w = document.createElement("div"); w.className = "table-wrap";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    content.querySelectorAll("pre").forEach(pre => {
      if(!pre.parentElement.classList.contains("code-wrap")){
        const w = document.createElement("div"); w.className = "code-wrap";
        pre.parentNode.insertBefore(w, pre); w.appendChild(pre);
      }
      addCopy(pre);
    });
    closeMenu();
  }

  function addCopy(pre){
    if(pre.parentElement.querySelector(".copy-btn")) return;
    const btn = document.createElement("button");
    btn.className = "copy-btn"; btn.textContent = "Copiar";
    btn.onclick = () => {
      navigator.clipboard.writeText(pre.innerText);
      btn.textContent = "Copiado!"; setTimeout(() => btn.textContent = "Copiar", 1400);
    };
    pre.parentElement.appendChild(btn);
  }

  function route(){ load(decodeURIComponent(location.hash.slice(1)) || "README.md"); }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
